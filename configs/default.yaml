camera:
  source: 0
  infer_size: [640, 480]
  process_every_n: 1
  mjpeg_quality: 75

use_cases:
  safety_mask:
    enabled: false
    # Mask detection model only
    model_path: model/ppe.pt
    conf_threshold: 0.30
    grace_period: 3.0
    alert_cooldown: 5
    mask_class: mask
    history_window: 10
    violation_ratio: 0.9
    labels:
      mask: Safety Mask

  occupancy:
    enabled: false
    max_occupancy: 0
    alert_cooldown: 5
    stable_frames: 15

  proximity:
    enabled: false
    safe_distance: 1.0
    assumed_height: 1.7
    camera_fov_horizontal: 78.0
    grace_period: 3.0
    alert_cooldown: 5

server:
  host: 0.0.0.0
  port: 5000

database:
  path: data/sidp.db

shared:
  person_model_path: model/yolo26n.pt
