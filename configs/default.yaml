camera:
  source: 0
  infer_size: [640, 480]
  process_every_n: 1
  mjpeg_quality: 75

use_cases:
  safety_mask:
    enabled: false
    model_path: model/ppe.pt
    person_model_path: model/yolo26n.pt
    conf_threshold: 0.40
    person_conf_threshold: 0.30
    grace_period: 3.0
    alert_cooldown: 12
    mask_class: mask
    labels:
      mask: Safety Mask

  occupancy:
    enabled: false
    model_path: model/yolo26n.pt
    conf_threshold: 0.45
    max_occupancy: 1
    grace_period: 3.0
    alert_cooldown: 15
    stable_frames: 15

  proximity:
    enabled: false
    model_path: model/yolo26n.pt
    conf_threshold: 0.45
    safe_distance: 1.0
    assumed_height: 1.7
    camera_fov_horizontal: 78.0
    grace_period: 3.0
    alert_cooldown: 10

server:
  host: 0.0.0.0
  port: 5000

database:
  path: data/sidp.db

shared:
  person_model_path: model/yolo26n.pt
