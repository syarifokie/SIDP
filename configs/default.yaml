camera:
  source: 0 # 0 = webcam | "video.mp4" = file
  infer_size: [640, 480]
  process_every_n: 2 # 1 = every frame (RTX 5060), 2 = every other
  mjpeg_quality: 80

use_cases:
  ppe:
    enabled: false
    model_path: model/ppe.pt
    person_model_path: model/yolo26n.pt
    conf_threshold: 0.30
    person_conf_threshold: 0.50
    grace_period: 5
    required_items:
      - mask
    alert_cooldown: 12
    labels:
      Gloves: Gloves
      Vest: Vest
      goggles: Goggles
      helmet: Helmet
      mask: Face Mask
      safety_shoe: Safety Shoes

  occupancy:
    enabled: false
    model_path: model/yolo26n.pt
    conf_threshold: 0.40
    max_occupancy: 0
    grace_period: 50
    alert_cooldown: 15

  no_phone:
    enabled: false
    model_path: model/yolo26n.pt
    conf_threshold: 0.40
    grace_period: 50
    phone_classes:
      - cell phone
    alert_cooldown: 10

server:
  host: 0.0.0.0
  port: 5000

database:
  path: data/sidp.db
